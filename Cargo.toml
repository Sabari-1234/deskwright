[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["Sabari-1234"]
repository = "https://github.com/Sabari-1234/deskwright"
homepage = "https://github.com/Sabari-1234/deskwright"
keywords = ["desktop", "accessibility", "automation", "mcp", "macos"]
categories = ["os::macos-apis", "development-tools::testing", "accessibility"]

[workspace.dependencies]
deskwright-core = { path = "crates/deskwright-core" }
deskwright-macos = { path = "crates/deskwright-macos" }
deskwright-mcp = { path = "crates/deskwright-mcp" }
deskwright-portable = { path = "crates/deskwright-portable" }
deskwright-runner = { path = "crates/deskwright-runner" }

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
core-foundation = "0.10.1"
enigo = "0.6.1"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
libc = "0.2.191"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xcap = "0.9.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release packaging: `dist` builds the binaries on a version tag and attaches them, a shell
# installer, a Homebrew formula and an npm package to the GitHub Release. The formula is pushed
# to the tap by scripts/update-homebrew-tap.sh. See RELEASING.md.
[workspace.metadata.dist]
cargo-dist-version = "0.33.1"
ci = "github"
installers = ["shell", "npm", "homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
install-path = "CARGO_HOME"
install-updater = false

[profile.dist]
inherits = "release"
lto = "thin"
